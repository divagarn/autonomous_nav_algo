# radar_tracker: the EKF tracker (ekf/). The tracker's own settings (noise, gates, POE
# lifecycle, MIO lane +-1.4 m) are in ekf/aeb_wrapper.cpp, unchanged; only the input side is here.
radar_tracker:
  ros__parameters:
    radar_topic: /smart_radar/can_targets_0
    odom_topic: /odom              # ego speed = |twist.linear.x| (original: CAN vehicle speed)
    frame_id: ""                   # "" = radar frame of the scan (mount below is identity in x/y)
    # main.c transform_to_vehicle(): the original truck's front radar 0 is mounted (0, 0, 0.72), yaw 0.
    # z is added so the tracker's ground test (z < 0.12 m, weak RCS) sees height above ground:
    # set mount_z to this buggy's radar height.
    mount_x: 0.0
    mount_y: 0.0
    mount_z: 0.5
    mount_yaw_deg: 0
    azimuth_bias_rad: 0.0          # original truck: 0.028431025773286819 (calibrated for that radar)
    radar_filters: true            # main.c radar_filters 1: AEB view keeps noise < 96 only
    noise_max: 96.0
    odom_timeout: 0.5              # s; older odometry -> ego speed 0
